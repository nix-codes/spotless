[package]
name = "spotless-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Spotless on Android, the feasibility spike"
publish = false

# Its own workspace: the spike isn't part of the desktop build.
[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# The core the desktop shares, and what the spike uses of it directly.
spotless-core = { path = "../../core" }
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread"] }
librespot-core = { git = "https://github.com/nix-codes/librespot", rev = "1c54cc12a74bd016c459bd4b2991d692906bb13f", default-features = false, features = ["rustls-tls-native-roots"] }

# Android only: the bridge to Java, the log, and cpal's context.
jni = "0.21"
ndk-context = "0.1"
android_logger = "0.15"

[patch.crates-io]
hyper-proxy2 = { git = "https://github.com/crmne/hyper-proxy2", rev = "efca4811371ddae81c06be168de54194938d70b1" }

[profile.dev.package."*"]
opt-level = 2
