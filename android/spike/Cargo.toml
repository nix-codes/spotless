[package]
name = "spotless-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Spotless on Android, the feasibility spike"
publish = false

# Its own workspace: the spike isn't part of the desktop build. The
# patched librespot (build.sh) keeps its own.
[workspace]
exclude = ["librespot"]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# What the desktop core files included by src/lib.rs need, at the
# desktop's versions.
anyhow = "1"
log = "0.4"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs"] }
rodio = { version = "0.21", default-features = false, features = ["playback"] }
cpal = "0.16"
thiserror = "2"
librespot-core = { git = "https://github.com/crmne/librespot", rev = "d04729018248f11c954b50ff6a3405801ff5af08", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-playback = { git = "https://github.com/crmne/librespot", rev = "d04729018248f11c954b50ff6a3405801ff5af08", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-metadata = { git = "https://github.com/crmne/librespot", rev = "d04729018248f11c954b50ff6a3405801ff5af08", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-oauth = { git = "https://github.com/crmne/librespot", rev = "d04729018248f11c954b50ff6a3405801ff5af08", default-features = false, features = ["rustls-tls-native-roots"] }

# Android only: the bridge to Java, the log, and cpal's context.
jni = "0.21"
ndk-context = "0.1"
android_logger = "0.15"
libc = "0.2"

[patch.crates-io]
hyper-proxy2 = { git = "https://github.com/crmne/hyper-proxy2", rev = "efca4811371ddae81c06be168de54194938d70b1" }

[profile.dev.package."*"]
opt-level = 2

# librespot with its OS constant patched for Android (build.sh); all its
# crates, so there is one copy of each.
[patch."https://github.com/crmne/librespot"]
librespot-audio = { path = "librespot/audio" }
librespot-core = { path = "librespot/core" }
librespot-metadata = { path = "librespot/metadata" }
librespot-oauth = { path = "librespot/oauth" }
librespot-playback = { path = "librespot/playback" }
librespot-protocol = { path = "librespot/protocol" }
