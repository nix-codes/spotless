[package]
name = "spotless-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Spotless's core for the Android app, through UniFFI"
publish = false

[lib]
# The cdylib is the app's libspotless_ffi.so; the lib lets
# uniffi-bindgen and the tests link it.
crate-type = ["cdylib", "lib"]

[[bin]]
# Writes the Kotlin bindings from the built library.
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
spotless-core.workspace = true
log.workspace = true
thiserror.workspace = true
uniffi = "0.32.2"

[target.'cfg(target_os = "android")'.dependencies]
# The context cpal's AAudio backend asks Java for devices with, the
# certificate verifier's (the same as the core's), and the log.
jni = "0.22"
ndk-context = "0.1"
android_logger = "0.15"
rustls-platform-verifier = "0.7"
