[package]
name = "spotless"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "A minimal Spotify player in the spirit of Winamp"
default-run = "spotless"

[lib]
name = "spotless"
path = "src/lib.rs"

[[bin]]
name = "spotless"
path = "src/main.rs"

[dependencies]
anyhow = "1"
log = "0.4"
env_logger = "0.11"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
eframe = { version = "0.36", default-features = false, features = ["accesskit", "glow", "default_fonts", "wayland", "x11"] }
egui = "0.36"
rodio = { version = "0.21", default-features = false, features = ["playback"] }
cpal = "0.16"
thiserror = "2"
# librespot from the fork spotifast pins (crmne/librespot spotifast-dev):
# librespot's dev branch plus fixes not yet released, among them recovery
# after a session drop and a distinct error when Spotify refuses an audio
# key. rustls everywhere, so there is one TLS stack and no OpenSSL.
#
# Audio goes through our own rodio sink (src/playback/sink.rs), not
# librespot's, which panics when there is no output device. Same rodio and
# cpal versions as librespot's backend.
librespot-core = { git = "https://github.com/crmne/librespot", rev = "d04729018248f11c954b50ff6a3405801ff5af08", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-playback = { git = "https://github.com/crmne/librespot", rev = "d04729018248f11c954b50ff6a3405801ff5af08", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-metadata = { git = "https://github.com/crmne/librespot", rev = "d04729018248f11c954b50ff6a3405801ff5af08", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-oauth = { git = "https://github.com/crmne/librespot", rev = "d04729018248f11c954b50ff6a3405801ff5af08", default-features = false, features = ["rustls-tls-native-roots"] }

[patch.crates-io]
# hyper-proxy2's unreleased rustls 0.23 update, as spotifast carries it, so
# librespot's proxy support uses the same rustls as everything else.
hyper-proxy2 = { git = "https://github.com/crmne/hyper-proxy2", rev = "efca4811371ddae81c06be168de54194938d70b1" }

[profile.dev.package."*"]
# Dependencies optimised even in debug builds: audio decoding is too slow otherwise.
opt-level = 2
