[workspace]
members = ["core", "android/ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/nix-codes/spotless"

# Versions the core and the desktop app share.
[workspace.dependencies]
spotless-core = { path = "core" }
anyhow = "1"
log = "0.4"
fastrand = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs"] }
open = "5"
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png"] }
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }

[package]
name = "spotless"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A minimal Spotify player in the spirit of Winamp"
default-run = "spotless"

[lib]
name = "spotless"
path = "src/lib.rs"

[[bin]]
name = "spotless"
path = "src/main.rs"

[dependencies]
spotless-core.workspace = true
anyhow.workspace = true
log.workspace = true
fastrand.workspace = true
thiserror.workspace = true
tokio.workspace = true
open.workspace = true
image.workspace = true
env_logger.workspace = true
eframe = { version = "0.36", default-features = false, features = ["accesskit", "glow", "default_fonts", "wayland", "x11"] }
egui = "0.36"
# The event loop eframe runs on, to turn off raw mouse motion (src/main.rs).
winit = { version = "0.30", default-features = false }
# Skins (src/skin/zip.rs) are inflated with the flate2 librespot already builds.
flate2 = "1"
# Spotless skins' manifests (src/skin/format/), keys kept in file order so
# problems are listed as the author wrote them.
toml = { version = "1", features = ["preserve_order"] }
# Updates (src/update.rs): GitHub's releases, read and downloaded, and the
# download checked against the release's SHA256SUMS.
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
# Media keys (MPRIS): the zbus egui already builds for accessibility.
zbus = "5"
# The tray icon (src/tray.rs): a StatusNotifierItem on the session bus.
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(windows)'.dependencies]
# Media keys and the single-instance check (src/media/smtc.rs), the tray
# icon (src/tray/notify_icon.rs). The same windows crate version the rest
# of the build already pulls in.
windows = { version = "0.62", features = [
    "Foundation",
    "Media",
    "Storage_Streams",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
raw-window-handle = "0.6"

[patch.crates-io]
# hyper-proxy2's unreleased rustls 0.23 update, as spotifast carries it, so
# librespot's proxy support uses the same rustls as everything else.
hyper-proxy2 = { git = "https://github.com/crmne/hyper-proxy2", rev = "efca4811371ddae81c06be168de54194938d70b1" }

[profile.dev.package."*"]
# Dependencies optimised even in debug builds: audio decoding is too slow otherwise.
opt-level = 2

[dev-dependencies]
# The README's screenshots (examples/screenshots.rs), drawn without a window.
egui_kittest = { version = "0.36", features = ["wgpu"] }

[build-dependencies]
winresource = "0.1.34"
