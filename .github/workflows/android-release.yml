# Builds the Android app's release APK for a tag like android-v0.1.0, signs
# it with the release key and puts it in a draft GitHub release, to look over
# and publish by hand. packaging/android/release.sh makes the tag. The
# desktop app is released on its own.
#
# The tag gives the version; the app's build reads it from SPOTLESS_VERSION.
# The release notes list the commits since the previous android-v tag that
# touch the app or the core it shares with the desktop.
#
# The key comes from the repository's secrets:
#   ANDROID_KEYSTORE           the keystore file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  its password
#   ANDROID_KEY_ALIAS          the key's alias in it
#   ANDROID_KEY_PASSWORD       the key's password

name: Android Release

on:
  push:
    tags: ["android-v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release APK
    runs-on: ubuntu-24.04
    steps:
      # The whole history, for the commits since the previous release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version
        run: echo "SPOTLESS_VERSION=${GITHUB_REF_NAME#android-v}" >> "$GITHUB_ENV"

      - name: Rust
        run: rustup show active-toolchain && rustup target add aarch64-linux-android

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # Shared with the Build workflow's Android job, which builds the same.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android

      # The bindings are read off a build for the runner itself, whose cpal
      # needs ALSA's headers.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config

      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::The ANDROID_KEYSTORE secret isn't set"
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SPOTLESS_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: App
        working-directory: android
        env:
          SPOTLESS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SPOTLESS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SPOTLESS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      # Fails if the APK isn't signed, and gives the key's fingerprint for
      # the release notes.
      - name: Check the signature
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          apk=spotless-android-$SPOTLESS_VERSION-arm64.apk
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          "$apksigner" verify --print-certs "$apk" | tee certs.txt
          echo "APK=$apk" >> "$GITHUB_ENV"
          echo "CERT=$(sed -n 's/.*certificate SHA-256 digest: //p' certs.txt | head -1)" >> "$GITHUB_ENV"
          echo "SHA=$(sha256sum "$apk" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'android-v*' HEAD^ 2>/dev/null || true)
          {
            echo "Spotless for Android $SPOTLESS_VERSION, for 64-bit ARM phones on Android 10 or later."
            echo
            if [ -n "$previous" ]; then
              echo "## Changes since ${previous#android-v}"
              echo
              git log --no-merges --format='- %s' "$previous..HEAD" -- android core
              echo
            fi
            echo "APK SHA-256: \`$SHA\`"
            echo "Signing certificate SHA-256: \`$CERT\`"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "$APK" --draft \
            --title "Spotless for Android $SPOTLESS_VERSION" --notes-file notes.md
