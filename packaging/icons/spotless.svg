  <g fill="#2bff62">
    <rect x="144" y="122" width="16" height="66" rx="2"/>
    <rect x="168" y="96" width="16" height="92" rx="2"/>
  </g>
  <g fill="#14a83a">
    <rect x="70" y="162" width="16" height="26" rx="2"/>
    <rect x="94" y="150" width="16" height="38" rx="2"/>
    <rect x="118" y="138" width="16" height="50" rx="2"/>
  </g>
</svg>
