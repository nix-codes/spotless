<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Spotless: a Winamp-style bevelled frame around a green LCD. Colours from src/ui/theme.rs. -->
  <defs>
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c4c62"/>
      <stop offset="1" stop-color="#2a2a37"/>
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="36" fill="#0b0b0f"/>
  <rect x="16" y="16" width="224" height="224" rx="32" fill="url(#bevel)"/>
  <rect x="40" y="40" width="176" height="176" rx="14" fill="#111117"/>
  <rect x="44" y="44" width="168" height="168" rx="11" fill="#0b0b0f"/>
