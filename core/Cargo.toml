[package]
name = "spotless-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Spotless's core: the Spotify session, playback and playlists, with no interface"

[dependencies]
anyhow.workspace = true
log.workspace = true
fastrand.workspace = true
thiserror.workspace = true
tokio.workspace = true
open.workspace = true
image.workspace = true
dirs = "6"
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
rodio = { version = "0.21", default-features = false, features = ["playback"] }
cpal = "0.16"
# Last.fm: request signatures are MD5; the approval page opens in the browser.
md-5 = "0.10"
# Accents folded to their base letters, matching songs by name.
unicode-normalization = "0.1"
# librespot from Spotless's own fork (nix-codes/librespot, branch
# spotless-buffering). It is the fork spotifast pins (crmne/librespot
# spotifast-dev: librespot's dev branch plus fixes not yet released, among
# them recovery after a session drop and a distinct error when Spotify
# refuses an audio key), plus what the Android port needs: the
# android-as-linux feature, OAuthClientBuilder::with_url_handler, and audio
# keys asked for again when their answer is late; songs downloaded ahead
# to their end, not just a few seconds ahead of playback; a sign-in that
# waits for the browser without holding a thread, so it can be given up;
# and, in Connect,
# a song playing from the queue kept current when playback comes here
# while shuffling, and play and pause shown as they happen, even in quick
# succession. rustls everywhere, so there is one TLS stack and no OpenSSL.
#
# Audio goes through our own rodio sink (src/playback/sink.rs; on Android,
# src/playback/aaudio.rs), not librespot's, which panics when there is no
# output device. Same rodio and
# cpal versions as librespot's backend.
librespot-core = { git = "https://github.com/nix-codes/librespot", rev = "e51e399f57ec997be29ee9246f6d47d6ce80239f", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-playback = { git = "https://github.com/nix-codes/librespot", rev = "e51e399f57ec997be29ee9246f6d47d6ce80239f", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-metadata = { git = "https://github.com/nix-codes/librespot", rev = "e51e399f57ec997be29ee9246f6d47d6ce80239f", default-features = false, features = ["rustls-tls-native-roots"] }
# Only for the Spotify tab (`spotify-tab`, below).
librespot-connect = { git = "https://github.com/nix-codes/librespot", rev = "e51e399f57ec997be29ee9246f6d47d6ce80239f", default-features = false, features = ["rustls-tls-native-roots"], optional = true }
librespot-oauth = { git = "https://github.com/nix-codes/librespot", rev = "e51e399f57ec997be29ee9246f6d47d6ce80239f", default-features = false, features = ["rustls-tls-native-roots"] }
# The metadata service's own messages, to read many albums or songs in one
# request (librespot's Metadata::get asks for one at a time).
librespot-protocol = { git = "https://github.com/nix-codes/librespot", rev = "e51e399f57ec997be29ee9246f6d47d6ce80239f", default-features = false }
protobuf = "3.7"
futures-util = "0.3"

[features]
# The Spotify tab: Spotless as a Spotify Connect device, showing and
# changing the account's queue. Off: the tab can't be shown, and the
# device and its librespot-connect aren't built (src/spotify/remote.rs,
# src/backend/worker/connect.rs).
spotify-tab = ["dep:librespot-connect"]
# The internals made public, for the live probes in examples/ only: the
# apps see just what lib.rs shows.
probes = []

# The live probes reach into the internals (the `probes` feature):
#   cargo run -p spotless-core --features probes --example follow_probe
[[example]]
name = "connect_probe"
required-features = ["spotify-tab", "probes"]

[[example]]
name = "catalog_probe"
required-features = ["probes"]

[[example]]
name = "download_probe"
required-features = ["probes"]

[[example]]
name = "follow_probe"
required-features = ["probes"]

[[example]]
name = "levelling_probe"
required-features = ["probes"]

[[example]]
name = "listen_probe"
required-features = ["probes"]

[[example]]
name = "output_probe"
required-features = ["probes"]

[[example]]
name = "playlists_probe"
required-features = ["probes"]

[[example]]
name = "playlist_write_probe"
required-features = ["probes"]

[[example]]
name = "reconnect_probe"
required-features = ["probes"]

[[example]]
name = "signin_probe"
required-features = ["probes"]

[[example]]
name = "sink_probe"
required-features = ["probes"]

[[example]]
name = "sync_devices"
required-features = ["probes"]

[[example]]
name = "sync_probe"
required-features = ["probes"]

[[example]]
name = "takeover_probe"
required-features = ["probes"]

[[example]]
name = "top_tracks_probe"
required-features = ["probes"]

[[example]]
name = "unavailable_probe"
required-features = ["probes"]

[dev-dependencies]
# The probes in examples/ log to the terminal.
env_logger.workspace = true
# download_probe reads a song's file the way the player does.
librespot-audio = { git = "https://github.com/nix-codes/librespot", rev = "e51e399f57ec997be29ee9246f6d47d6ce80239f", default-features = false, features = ["rustls-tls-native-roots"] }

# On Android, librespot presents itself as the Linux desktop client, whose
# credential Spotless signs in with: as the Android client, Spotify takes the
# sign-in and then refuses every request.
[target.'cfg(target_os = "android")'.dependencies]
librespot-core = { git = "https://github.com/nix-codes/librespot", rev = "e51e399f57ec997be29ee9246f6d47d6ce80239f", default-features = false, features = ["rustls-tls-native-roots", "android-as-linux"] }
# Audio goes straight to AAudio (src/playback/aaudio.rs), through the same
# ndk crate cpal uses (API 28 for the usage and content type; the app needs
# 29).
ndk = { version = "0.9", default-features = false, features = ["audio", "api-level-28"] }
