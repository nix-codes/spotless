[package]
name = "spotless-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Spotless's core: the Spotify session, playback and playlists, with no interface"

[dependencies]
anyhow.workspace = true
log.workspace = true
fastrand.workspace = true
thiserror.workspace = true
tokio.workspace = true
open.workspace = true
image.workspace = true
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
rodio = { version = "0.21", default-features = false, features = ["playback"] }
cpal = "0.16"
# Last.fm: request signatures are MD5; the approval page opens in the browser.
md-5 = "0.10"
# librespot from Spotless's own fork (nix-codes/librespot, branch spotless).
# It is the fork spotifast pins (crmne/librespot spotifast-dev: librespot's
# dev branch plus fixes not yet released, among them recovery after a
# session drop and a distinct error when Spotify refuses an audio key),
# plus what the Android port needs: the android-as-linux feature,
# OAuthClientBuilder::with_url_handler, audio keys asked for again when
# their answer is late, and rustls-tls-platform-verifier. rustls everywhere, so there is one TLS stack and no
# OpenSSL.
#
# Audio goes through our own rodio sink (src/playback/sink.rs), not
# librespot's, which panics when there is no output device. Same rodio and
# cpal versions as librespot's backend.
librespot-core = { git = "https://github.com/nix-codes/librespot", rev = "ce680a0ab1d99324e9fdadb940e390d205b0064d", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-playback = { git = "https://github.com/nix-codes/librespot", rev = "ce680a0ab1d99324e9fdadb940e390d205b0064d", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-metadata = { git = "https://github.com/nix-codes/librespot", rev = "ce680a0ab1d99324e9fdadb940e390d205b0064d", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-oauth = { git = "https://github.com/nix-codes/librespot", rev = "ce680a0ab1d99324e9fdadb940e390d205b0064d", default-features = false, features = ["rustls-tls-native-roots"] }

[dev-dependencies]
# The probes in examples/ log to the terminal.
env_logger.workspace = true

# On Android, librespot presents itself as the Linux desktop client, whose
# credential Spotless signs in with: as the Android client, Spotify takes the
# sign-in and then refuses every request.
#
# Certificates are checked through Android's own verifier there
# (rustls-platform-verifier, which android/ffi initializes): rustls-native-certs
# finds no roots on Android.
[target.'cfg(target_os = "android")'.dependencies]
librespot-core = { git = "https://github.com/nix-codes/librespot", rev = "ce680a0ab1d99324e9fdadb940e390d205b0064d", default-features = false, features = ["rustls-tls-native-roots", "rustls-tls-platform-verifier", "android-as-linux"] }
rustls = { version = "0.23", default-features = false }
rustls-platform-verifier = "0.7"
