[package]
name = "spotless-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Spotless's core: the Spotify session, playback and playlists, with no interface"

[dependencies]
anyhow.workspace = true
log.workspace = true
fastrand.workspace = true
thiserror.workspace = true
tokio.workspace = true
open.workspace = true
image.workspace = true
dirs = "6"
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
rodio = { version = "0.21", default-features = false, features = ["playback"] }
cpal = "0.16"
# Songs download in parts while they play (src/playback/download), and are
# kept decrypted on the fly (AES-CTR), whole or not at all.
bytes = "1"
tempfile = "3"
aes = "0.8"
ctr = "0.9"
# MEGA's keys, handles and attributes are in base 64 (URL-safe, unpadded).
base64 = "0.22"
# Spotify's servers are asked through the session's HTTP client, as hyper
# answers.
hyper = "1"
http-body-util = "0.1"
# Decodes the player's audio: the formats Spotify's files come in.
symphonia = { version = "0.5", default-features = false, features = ["mp3", "ogg", "vorbis", "flac"] }
# Last.fm: request signatures are MD5; the approval page opens in the browser.
md-5 = "0.10"
# Accents folded to their base letters, matching songs by name.
unicode-normalization = "0.1"
# librespot from Spotless's own fork (nix-codes/librespot, branch
# spotless-buffering). It is the fork spotifast pins (crmne/librespot
# spotifast-dev: librespot's dev branch plus fixes not yet released, among
# them recovery after a session drop and a distinct error when Spotify
# refuses an audio key). Spotless takes from it the session, sign-in,
# metadata, audio keys and the CDN's URLs; it downloads, keeps and plays
# songs itself (src/playback). For that the fork adds the
# android-as-linux feature, OAuthClientBuilder::with_url_handler, a
# sign-in that waits for the browser without holding a thread, so it can
# be given up, audio keys asked for again when their answer is late and
# kept in memory while the program runs, and HTTP/2 connections pinged,
# so one left dead by a network change is replaced. Its download fixes
# (songs fetched ahead to their end, cached whole or not at all) serve
# only the Spotify tab's player now, as do its Connect fixes: a song
# playing from the queue kept current when playback comes here while
# shuffling, and play and pause shown as they happen, even in quick
# succession. rustls everywhere, so there is one TLS stack and no OpenSSL.
#
# Audio goes out through Spotless's own outputs (src/playback/sink.rs,
# rodio; on Android, src/playback/aaudio.rs), which don't panic when
# there is no output device.
librespot-core = { git = "https://github.com/nix-codes/librespot", rev = "2d2b7aa146c6afc07927e23ec407fc75fc253591", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-metadata = { git = "https://github.com/nix-codes/librespot", rev = "2d2b7aa146c6afc07927e23ec407fc75fc253591", default-features = false, features = ["rustls-tls-native-roots"] }
# Only for the Spotify tab (`spotify-tab`, below): Connect, and the player
# it plays through. Spotless's own player is in src/playback.
librespot-connect = { git = "https://github.com/nix-codes/librespot", rev = "2d2b7aa146c6afc07927e23ec407fc75fc253591", default-features = false, features = ["rustls-tls-native-roots"], optional = true }
librespot-playback = { git = "https://github.com/nix-codes/librespot", rev = "2d2b7aa146c6afc07927e23ec407fc75fc253591", default-features = false, features = ["rustls-tls-native-roots"], optional = true }
librespot-oauth = { git = "https://github.com/nix-codes/librespot", rev = "2d2b7aa146c6afc07927e23ec407fc75fc253591", default-features = false, features = ["rustls-tls-native-roots"] }
# The metadata service's own messages, to read many albums or songs in one
# request (librespot's Metadata::get asks for one at a time).
librespot-protocol = { git = "https://github.com/nix-codes/librespot", rev = "2d2b7aa146c6afc07927e23ec407fc75fc253591", default-features = false }
protobuf = "3.7"
futures-util = "0.3"

[features]
# The Spotify tab: Spotless as a Spotify Connect device, showing and
# changing the account's queue. Off: the tab can't be shown, and the
# device, librespot-connect and librespot-playback aren't built
# (src/spotify/remote.rs, src/backend/worker/connect.rs).
spotify-tab = ["dep:librespot-connect", "dep:librespot-playback"]
# The internals made public, for the live probes in examples/ only: the
# apps see just what lib.rs shows.
probes = []

# The live probes reach into the internals (the `probes` feature):
#   cargo run -p spotless-core --features probes --example follow_probe
[[example]]
name = "connect_probe"
required-features = ["spotify-tab", "probes"]

[[example]]
name = "cache_probe"
required-features = ["probes"]

[[example]]
name = "catalog_probe"
required-features = ["probes"]

[[example]]
name = "download_probe"
required-features = ["probes"]

[[example]]
name = "follow_probe"
required-features = ["probes"]

[[example]]
name = "mega_probe"
required-features = ["probes"]

[[example]]
name = "mega_import_probe"
required-features = ["probes"]

[[example]]
name = "levelling_probe"
required-features = ["probes"]

[[example]]
name = "listen_probe"
required-features = ["probes"]

[[example]]
name = "output_probe"
required-features = ["probes"]

[[example]]
name = "player_probe"
required-features = ["probes"]

[[example]]
name = "playlists_probe"
required-features = ["probes"]

[[example]]
name = "playlist_write_probe"
required-features = ["probes"]

[[example]]
name = "reconnect_probe"
required-features = ["probes"]

[[example]]
name = "signin_probe"
required-features = ["probes"]

[[example]]
name = "sink_probe"
required-features = ["probes"]

[[example]]
name = "spotify_code_probe"
required-features = ["probes"]

[[example]]
name = "sync_devices"
required-features = ["probes"]

[[example]]
name = "sync_probe"
required-features = ["probes"]

[[example]]
name = "takeover_probe"
required-features = ["probes"]

[[example]]
name = "top_tracks_probe"
required-features = ["probes"]

[[example]]
name = "unavailable_probe"
required-features = ["probes"]

[dev-dependencies]
# The decoder's tests decode WAV files they make.
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm"] }
# The probes in examples/ log to the terminal.
env_logger.workspace = true

# On Android, librespot presents itself as the Linux desktop client, whose
# credential Spotless signs in with: as the Android client, Spotify takes the
# sign-in and then refuses every request.
[target.'cfg(target_os = "android")'.dependencies]
librespot-core = { git = "https://github.com/nix-codes/librespot", rev = "2d2b7aa146c6afc07927e23ec407fc75fc253591", default-features = false, features = ["rustls-tls-native-roots", "android-as-linux"] }
# Audio goes straight to AAudio (src/playback/aaudio.rs), through the same
# ndk crate cpal uses (API 28 for the usage and content type; the app needs
# 29).
ndk = { version = "0.9", default-features = false, features = ["audio", "api-level-28"] }
